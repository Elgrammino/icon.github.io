<!DOCTYPE html>
<html>

<head>
    <title>Calculator</title>
    <meta charset="utf-8">
    <meta name="application-name" content="Calculator">
    <meta name="description" content="Talc Powder App" />
    <meta name="copyright" content="&copy; 2020 Michael Stark">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-title" content="Calculator">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="msapplication-navbutton-color" content="#000000">
    <meta name="msapplication-starturl" content="/">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./images/icon-512.png">
    <link rel="apple-touch-icon" href="./images/icon-512.png">
    <link rel="stylesheet" href="./css/main.css">
    <script defer src="./js/version.js"></script>
    <script defer src="./js/i18n/i18n_en.js"></script>
    <script defer src="./js/i18n/i18n_ru.js"></script>
    <script defer src="./js/i18n/i18n.js"></script>
    <script defer src="./js/i18n/i18nextBrowserLanguageDetector.min.js"></script>
    <script defer src="./js/i18n/i18next.js"></script>
    <script defer src="./js/peerjs.min.js"></script>
    <script defer src="./js/calculator.js"></script>
    <script defer src="./js/magic.js"></script>
    <script defer src="./js/rc.js"></script>
</head>

<body>
    <div id="loading" class="hidden">
        <div id="spinner"></div>
    </div>
    <div id="overlayDDF" class="hidden"></div>
    <div id="historyKey" class="glassKey">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6.5" r="1.4" class="fill"/><circle cx="5" cy="12" r="1.4" class="fill"/><circle cx="5" cy="17.5" r="1.4" class="fill"/><path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h10"/></svg>
    </div>
    <div id="calc">
        <div class="displayArea">
            <div id="expression"></div>
            <div class="displayS1" id="display">0</div>
        </div>
        <div class="row">
            <div class="button util pushOff" id="c">AC</div>
            <div class="button util pushOff" id="+-">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8h7M7 4.5v7M16.5 3.5l-9 17M13.5 16h7"/></svg>
            </div>
            <div class="button util pushOff" id="%">%</div>
            <div class="button operation pushOff" id="÷">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.6" r="1.9" class="fill"/><circle cx="12" cy="18.4" r="1.9" class="fill"/><path d="M4.5 12h15"/></svg>
            </div>
        </div>
        <div class="row">
            <div class="button digit pushOff" id="7">7</div>
            <div class="button digit pushOff" id="8">8</div>
            <div class="button digit pushOff" id="9">9</div>
            <div class="button operation pushOff" id="x">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.2 6.2l11.6 11.6M17.8 6.2L6.2 17.8"/></svg>
            </div>
        </div>
        <div class="row">
            <div class="button digit pushOff" id="4">4</div>
            <div class="button digit pushOff" id="5">5</div>
            <div class="button digit pushOff" id="6">6</div>
            <div class="button operation pushOff" id="-">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12h15"/></svg>
            </div>
        </div>
        <div class="row">
            <div class="button digit pushOff" id="1">1</div>
            <div class="button digit pushOff" id="2">2</div>
            <div class="button digit pushOff" id="3">3</div>
            <div class="button operation pushOff" id="+">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15"/></svg>
            </div>
        </div>
        <div class="row">
            <div class="glassKey pushOff" id="modeKey">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.8" width="14" height="18.4" rx="3.2"/><path d="M8.4 7h7.2"/><circle cx="9" cy="11.6" r="1.05" class="fill"/><circle cx="12" cy="11.6" r="1.05" class="fill"/><circle cx="15" cy="11.6" r="1.05" class="fill"/><circle cx="9" cy="15.2" r="1.05" class="fill"/><circle cx="12" cy="15.2" r="1.05" class="fill"/><circle cx="15" cy="15.2" r="1.05" class="fill"/></svg>
            </div>
            <div class="button digit pushOff" id="0">0</div>
            <div class="button digit pushOff" id="."></div>
            <div class="button operation pushOff" id="=">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8.6h14M5 15.4h14"/></svg>
            </div>
        </div>
        <div class="calcOffset"></div>
    </div>
</body>

</html>
