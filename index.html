<!DOCTYPE html>
<html>

<head>
    <title>Calculator</title>
    <meta charset="utf-8">
    <meta name="application-name" content="Calculator">
    <meta name="description" content="Calculator App" />
    <meta name="copyright" content="&copy; 2020 Michael Stark">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-title" content="Calculator">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="msapplication-navbutton-color" content="#000000">
    <meta name="msapplication-starturl" content="/">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./images/icon-512.png">
    <link rel="apple-touch-icon" href="./images/icon-512.png">
    <script>
        // classic interface (before iOS 26) is chosen on the instructions page and lives in ./old/
        try {
            if (localStorage.getItem("ui") === "classic") {
                window.location.replace("./old/" + window.location.search);
            }
        } catch (e) { }
    </script>
    <link rel="stylesheet" href="./css/main.css">
    <script defer src="./js/version.js"></script>
    <script defer src="./js/i18n/i18n_en.js"></script>
    <script defer src="./js/i18n/i18n_ru.js"></script>
    <script defer src="./js/i18n/i18n.js"></script>
    <script defer src="./js/i18n/i18nextBrowserLanguageDetector.min.js"></script>
    <script defer src="./js/i18n/i18next.js"></script>
    <script defer src="./js/peerjs.min.js"></script>
    <script defer src="./js/calculator.js"></script>
    <script defer src="./js/magic.js"></script>
    <script defer src="./js/rc.js"></script>
</head>

<body>
    <div id="loading" class="hidden">
        <div id="spinner"></div>
    </div>
    <div id="overlayDDF" class="hidden"></div>
    <div id="calc">
        <div class="topKey glassKey" id="historyKey">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12H8.4"/></svg>
        </div>
        <div class="topKey glassKey" id="modeKey">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="2.6" width="13" height="18.8" rx="2.6"/><rect x="8" y="5.2" width="8" height="3" rx="0.6" class="fill"/><circle cx="9" cy="11.4" r="1" class="fill"/><circle cx="12" cy="11.4" r="1" class="fill"/><circle cx="15" cy="11.4" r="1" class="fill"/><circle cx="9" cy="14.6" r="1" class="fill"/><circle cx="12" cy="14.6" r="1" class="fill"/><circle cx="15" cy="14.6" r="1" class="fill"/><circle cx="9" cy="17.8" r="1" class="fill"/><circle cx="12" cy="17.8" r="1" class="fill"/><circle cx="15" cy="17.8" r="1" class="fill"/></svg>
        </div>
        <div class="displayArea">
            <div id="expression"></div>
            <div class="displayS1" id="display">0</div>
        </div>
        <div class="row">
            <div class="button util pushOff" id="del">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 5h9.6a2.4 2.4 0 0 1 2.4 2.4v9.2a2.4 2.4 0 0 1-2.4 2.4H9.2a2 2 0 0 1-1.5-.7L2.8 12l4.9-6.3A2 2 0 0 1 9.2 5z"/><path d="M11.6 9.3l5.4 5.4M17 9.3l-5.4 5.4"/></svg>
            </div>
            <div class="button util pushOff" id="c">AC</div>
            <div class="button util pushOff" id="%">%</div>
            <div class="button operation pushOff" id="÷">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="1.7" class="fill"/><circle cx="12" cy="18" r="1.7" class="fill"/><path d="M5 12h14"/></svg>
            </div>
        </div>
        <div class="row">
            <div class="button digit pushOff" id="7">7</div>
            <div class="button digit pushOff" id="8">8</div>
            <div class="button digit pushOff" id="9">9</div>
            <div class="button operation pushOff" id="x">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
            </div>
        </div>
        <div class="row">
            <div class="button digit pushOff" id="4">4</div>
            <div class="button digit pushOff" id="5">5</div>
            <div class="button digit pushOff" id="6">6</div>
            <div class="button operation pushOff" id="-">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
            </div>
        </div>
        <div class="row">
            <div class="button digit pushOff" id="1">1</div>
            <div class="button digit pushOff" id="2">2</div>
            <div class="button digit pushOff" id="3">3</div>
            <div class="button operation pushOff" id="+">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </div>
        </div>
        <div class="row">
            <div class="button dark pushOff" id="+-">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.8h7M7 4.3v7M16.5 3.5l-9 17M13.5 16.2h7"/></svg>
            </div>
            <div class="button digit pushOff" id="0">0</div>
            <div class="button digit pushOff" id="."></div>
            <div class="button operation pushOff" id="=">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 9h13M5.5 15h13"/></svg>
            </div>
        </div>
        <div class="calcOffset"></div>
    </div>
    <div id="historySheet" class="hidden">
        <div class="historyBackdrop"></div>
        <div class="historyPanel" role="dialog" aria-modal="true">
            <div class="historyHead">
                <div class="historyGrabber"></div>
                <div class="historyBar">
                    <button type="button" class="historyPill" id="historyEdit"></button>
                    <button type="button" class="historyPill hidden" id="historyClear"></button>
                    <button type="button" class="historyRound" id="historyClose" aria-label="Close">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
                    </button>
                </div>
            </div>
            <div class="historyList" id="historyList"></div>
        </div>
    </div>
</body>

</html>
