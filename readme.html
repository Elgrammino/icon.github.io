<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Calculator App</title>
    <link rel="stylesheet" href="./css/page.css">
    <script src="./js/version.js"></script>
    <script src="./js/i18n/i18n_en.js"></script>
    <script src="./js/i18n/i18n_ru.js"></script>
    <script src="./js/i18n/i18n.js"></script>
    <script src="./js/i18n/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="./js/i18n/i18next.js"></script>
</head>

<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="back" id="back" href="./"></a>
            <span class="version" id="version"></span>
        </div>
    </header>
    <main class="page">
        <section class="hero" id="hero">
            <h1>Calculator App</h1>
            <p class="copy">&copy; 2020 Michael Stark</p>
            <section class="setting">
                <h2 id="uiTitle"></h2>
                <div class="segmented" role="radiogroup" aria-labelledby="uiTitle">
                    <button type="button" role="radio" data-ui="new" aria-checked="false"></button>
                    <button type="button" role="radio" data-ui="classic" aria-checked="false"></button>
                </div>
                <p id="uiHint"></p>
            </section>
            <form class="donate" action="https://www.paypal.com/donate" method="post" target="_top">
                <input type="hidden" name="hosted_button_id" value="QJGGN9PQFPFN6" />
                <button type="submit" id="donate"></button>
                <small>PayPal</small>
            </form>
        </section>
        <article class="doc" id="doc"></article>
    </main>
    <div class="toast" id="toast" role="status"></div>
    <script>
        document.getElementById("version").textContent = "v" + version;
        i18next.use(i18nextBrowserLanguageDetector).init(i18n).then(_ => {
            document.documentElement.lang = i18next.language;
            const params = new Proxy(new URLSearchParams(window.location.search), {
                get: (searchParams, prop) => searchParams.get(prop),
            });
            const isPart = !!params.part;
            // the iOS 26 view opens the instructions from its settings page, which has the switch and the donation;
            // the classic view opens them directly
            let isClassic = false;
            try { isClassic = localStorage.getItem("ui") === "classic"; } catch (e) { }
            const back = document.getElementById("back");
            back.textContent = i18next.t(isPart ? "backToContents" : isClassic ? "backToCalculator" : "backToSettings");
            back.href = isPart ? "./readme.html" : isClassic ? "./" : "./settings.html";
            document.getElementById("donate").textContent = i18next.t("donate");
            setupInterfaceSwitch();
            if (!isClassic) {
                document.querySelectorAll(".hero .setting, .hero .donate").forEach(el => el.remove());
            }
            if (isPart) {
                document.getElementById("hero").remove();
            }

            const doc = document.getElementById("doc");
            doc.innerHTML = i18next.t(isPart ? `readme_part_${params.part}` : "readme");
            styleDoc(doc);
            // a function page has one main title: make it the page heading
            const firstHeading = isPart && doc.querySelector("h2");
            if (firstHeading) {
                const h1 = document.createElement("h1");
                h1.textContent = firstHeading.textContent;
                firstHeading.replaceWith(h1);
            }

            let link = document.querySelector("a#link");
            if (link) {
                link.href = new URL("./?hostPeerId=" + localStorage.getItem("currentPeerId"), window.location.href).href;
                link.title = i18next.t("copyLinkHint");
                link.onpointerdown = _ => navigator.clipboard.writeText(link.href)
                    .then(_ => showToast("✓ " + link.href.replace(/^https?:\/\//, "").slice(0, 42) + "…"));
            }
        });

        // the translation HTML marks headings as centered <strong> paragraphs: turn them into real structure
        function styleDoc(doc) {
            for (const p of [...doc.querySelectorAll("p")]) {
                const isCentered = (p.getAttribute("style") || "").includes("center");
                p.removeAttribute("style");
                const onlyStrong = p.children.length === 1 && p.children[0].tagName === "STRONG" && p.textContent.trim() === p.children[0].textContent.trim();
                if (isCentered && (onlyStrong || p.textContent.trim().length < 30)) {
                    const isVersion = /^\d+\.\d+$/.test(p.textContent.trim());
                    const h = document.createElement(isVersion ? "h3" : "h2");
                    h.textContent = p.textContent.trim();
                    p.replaceWith(h);
                }
            }
            doc.querySelectorAll("[style]").forEach(el => el.removeAttribute("style"));
            // part pages start with <div><div><strong>Title</strong></div></div>: make it a heading
            const strongTitle = doc.querySelector("div > strong");
            if (strongTitle) {
                const h = document.createElement("h2");
                h.textContent = strongTitle.textContent.trim();
                let wrapper = strongTitle.parentElement;
                while (wrapper.parentElement !== doc && wrapper.parentElement.tagName === "DIV") {
                    wrapper = wrapper.parentElement;
                }
                wrapper.replaceWith(h);
            }

            // functions list: every function folds open in place, like the changelog
            const firstPartLink = doc.querySelector('a[href*="part="]');
            if (firstPartLink) {
                const list = firstPartLink.closest("ul");
                const functions = document.createElement("div");
                functions.className = "functions";
                list.querySelectorAll("li").forEach(li => {
                    const link = li.querySelector('a[href*="part="]');
                    const title = (link || li.querySelector("strong")).textContent.trim();
                    const body = document.createElement("div");
                    if (link) {
                        body.innerHTML = i18next.t(`readme_part_${new URL(link.href).searchParams.get("part")}`);
                        // the part starts with its own title: the summary shows it already
                        body.firstElementChild?.remove();
                        body.querySelectorAll("[style]").forEach(el => el.removeAttribute("style"));
                    } else {
                        li.querySelector("strong").remove();
                        li.querySelectorAll("br").forEach(br => br.remove());
                        const p = document.createElement("p");
                        p.innerHTML = li.innerHTML.trim();
                        body.append(p);
                    }
                    functions.append(fold(title, body));
                });
                (list.parentElement.closest("ul") || list).replaceWith(functions);
            }

            // changelog: everything from the heading before the first version into a collapsible block
            const firstVersion = doc.querySelector("h3");
            const title = firstVersion?.previousElementSibling;
            if (title && title.tagName === "H2") {
                const body = document.createElement("div");
                body.className = "changes";
                let node = title.nextSibling;
                while (node) {
                    const next = node.nextSibling;
                    body.append(node);
                    node = next;
                }
                const details = fold(title.textContent, body);
                details.classList.add("changelog");
                title.replaceWith(details);
            }
        }

        // collapsible card: title row with a chevron, body below
        function fold(title, body) {
            const details = document.createElement("details");
            const summary = document.createElement("summary");
            summary.textContent = title;
            body.classList.add("fold-body");
            details.append(summary, body);
            return details;
        }

        // "classic" = the interface before iOS 26 from ./old/, the calculator page switches on start
        function setupInterfaceSwitch() {
            document.getElementById("uiTitle").textContent = i18next.t("interface");
            document.getElementById("uiHint").textContent = i18next.t("interfaceHint");
            const buttons = document.querySelectorAll(".segmented button");
            const render = _ => {
                let current = "new";
                try { current = localStorage.getItem("ui") === "classic" ? "classic" : "new"; } catch (e) { }
                buttons.forEach(b => b.setAttribute("aria-checked", b.dataset.ui === current));
            };
            buttons.forEach(button => {
                button.textContent = i18next.t(button.dataset.ui === "classic" ? "interfaceClassic" : "interfaceNew");
                button.addEventListener("click", _ => {
                    try {
                        button.dataset.ui === "classic" ? localStorage.setItem("ui", "classic") : localStorage.removeItem("ui");
                    } catch (e) { }
                    render();
                    showToast("✓ " + i18next.t("saved"));
                });
            });
            render();
        }

        let toastTimer;
        function showToast(text) {
            const toast = document.getElementById("toast");
            toast.textContent = text;
            toast.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(_ => toast.classList.remove("show"), 1800);
        }
    </script>
</body>

</html>
