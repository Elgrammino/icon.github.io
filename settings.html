<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Calculator App</title>
    <link rel="stylesheet" href="./css/page.css">
    <style>
        /* settings: same look as the instructions, every block is a .setting card */
        .settings h1 {
            margin: 28px 0 0;
            font-family: var(--display);
            font-weight: 600;
            font-size: 30px;
            line-height: 1.15;
        }

        .setting h2 small {
            margin-left: 6px;
            color: var(--muted);
            font-family: var(--body);
            font-weight: 700;
        }

        .setting>p:first-of-type {
            margin-top: -4px;
        }

        /* grouped list like iPhone settings; every row is a glass plate that opens in place */
        .group-label {
            margin: 24px 6px 8px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .group {
            display: grid;
            gap: 8px;
        }

        .group-note {
            margin: 8px 6px 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .plate {
            border-radius: 18px;
            background: var(--glass);
            box-shadow: var(--glass-rim);
            -webkit-backdrop-filter: var(--blur);
            backdrop-filter: var(--blur);
        }

        .plate>summary {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 56px;
            padding: 8px 14px 8px 12px;
            border-radius: 18px;
            list-style: none;
            cursor: pointer;
        }

        .plate>summary::-webkit-details-marker {
            display: none;
        }

        .plate>summary:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .plate-text {
            flex: 1;
            min-width: 0;
        }

        .plate-title,
        .plate-sub {
            display: block;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .plate-title {
            font-weight: 700;
            font-size: 15px;
            line-height: 1.3;
        }

        .plate-sub {
            color: var(--muted);
            font-size: 12.5px;
            font-weight: 600;
            line-height: 1.35;
            font-variant-numeric: tabular-nums;
        }

        .chevron {
            flex: none;
            width: 8px;
            height: 8px;
            margin: 0 4px;
            border-right: 2px solid var(--muted);
            border-bottom: 2px solid var(--muted);
            transform: rotate(-45deg);
            transition: transform 0.2s ease-out;
        }

        .plate[open]>summary .chevron {
            transform: rotate(45deg);
        }

        /* round key like on the calculator: grey digit, orange operation */
        .keycap {
            flex: none;
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #333333;
            font-family: var(--display);
            font-size: 14px;
        }

        .keycap.op {
            background: var(--accent);
            color: #FFFFFF;
            font-family: var(--body);
            font-weight: 700;
            font-size: 20px;
        }

        .plate-body {
            display: grid;
            gap: 10px;
            padding: 2px 12px 14px;
        }

        .plate-body p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .field {
            min-width: 0;
            min-height: 44px;
            padding: 0 14px;
            border: 0;
            border-radius: 12px;
            background: rgb(0 0 0 / 45%);
            box-shadow: inset 0 0 0 0.5px var(--line);
            color: var(--text);
            font-family: var(--body);
            font-weight: 600;
            font-size: 16px;
            -webkit-user-select: text;
            user-select: text;
        }

        .field::placeholder {
            color: var(--muted);
            font-weight: 500;
        }

        .field:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .field.number {
            font-family: var(--display);
            font-size: 17px;
            letter-spacing: 0.04em;
        }

        .segmented.three {
            grid-template-columns: repeat(3, 1fr);
        }

        .segmented.three button {
            min-height: 38px;
            font-size: 13.5px;
        }

        .inline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-left: 4px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
        }

        .remove {
            min-height: 44px;
            border: 0;
            border-radius: 12px;
            background: none;
            color: #FF6B5E;
            font-family: var(--body);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .remove:active {
            background: rgb(255 107 94 / 12%);
        }

        .add {
            min-height: 52px;
            border: 0;
            color: var(--accent);
            font-family: var(--body);
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        .add:active {
            background: var(--glass-pressed);
        }

        /* digit picker: one digit, swipe down = next, up = previous, tap = next; wraps around */
        .swipe {
            position: relative;
            flex: none;
            width: 54px;
            height: 44px;
            overflow: hidden;
            border-radius: 12px;
            background: rgb(0 0 0 / 45%);
            box-shadow: inset 0 0 0 0.5px var(--line);
            cursor: ns-resize;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .swipe::before,
        .swipe::after {
            content: "";
            position: absolute;
            left: 50%;
            width: 5px;
            height: 5px;
            margin-left: -3px;
            border-left: 1.5px solid #6B6F74;
            border-top: 1.5px solid #6B6F74;
        }

        .swipe::before {
            top: 5px;
            transform: rotate(45deg);
        }

        .swipe::after {
            bottom: 5px;
            transform: rotate(225deg);
        }

        .swipe span {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--accent);
            font-family: var(--display);
            font-size: 18px;
            transition: transform 0.18s ease-out, opacity 0.18s ease-out;
        }

        .swipe:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {

            .swipe span,
            .chevron {
                transition: none;
            }
        }

        /* photo reveal inside the birthday plate */
        .reveal-photo {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .reveal-photo img {
            flex: none;
            width: 66px;
            height: 88px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: inset 0 0 0 0.5px var(--line);
        }

        .reveal-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-width: 0;
        }

        .small-button {
            display: inline-flex;
            align-items: center;
            min-height: 40px;
            padding: 0 14px;
            border: 0;
            border-radius: 999px;
            background: rgb(0 0 0 / 45%);
            box-shadow: inset 0 0 0 0.5px var(--line);
            color: var(--text);
            font-family: var(--body);
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
        }

        .small-button.accent {
            background: var(--glass-accent);
            box-shadow: var(--glass-accent-rim);
            color: var(--accent-ink);
        }

        .small-button.danger {
            color: #FF6B5E;
        }

        .small-button input {
            display: none;
        }

        textarea.field {
            min-height: 112px;
            padding: 10px 14px;
            font-size: 15px;
            line-height: 1.45;
            resize: vertical;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chips button {
            min-height: 34px;
            padding: 0 12px;
            border: 0;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--accent);
            font-family: var(--body);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .plate-body .example {
            padding: 10px 12px;
            border-radius: 12px;
            background: #F4F1EA;
            color: #18181A;
            font-family: "Times New Roman", Times, Georgia, serif;
            font-size: 15px;
        }

        .sub-label {
            margin: 4px 0 -4px 4px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }

        /* corner editor: the photo on the whole screen, 4 dots, a loupe over the finger */
        .editor {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            grid-template-rows: auto 1fr auto;
            background: #000;
            touch-action: none;
        }

        .editor[hidden] {
            display: none;
        }

        .editor-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: calc(8px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
        }

        .editor-bar span {
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }

        .editor-stage {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 0;
            overflow: hidden;
        }

        .editor-stage canvas.photo {
            display: block;
        }

        .handle {
            position: absolute;
            width: 44px;
            height: 44px;
            margin: -22px 0 0 -22px;
            border-radius: 50%;
            touch-action: none;
            cursor: grab;
        }

        .handle::after {
            content: "";
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 2px #FFF, 0 2px 8px rgb(0 0 0 / 60%);
        }

        .loupe {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            box-shadow: 0 0 0 2px #FFF, 0 6px 20px rgb(0 0 0 / 60%);
            pointer-events: none;
        }

        .editor-tools {
            display: grid;
            gap: 6px;
            padding: 10px max(16px, env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }

        .editor-tools input {
            width: 100%;
            accent-color: var(--accent);
        }

        .glass-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
            padding: 0 20px;
            border: 0;
            border-radius: 999px;
            background: var(--glass);
            box-shadow: var(--glass-rim);
            -webkit-backdrop-filter: var(--blur);
            backdrop-filter: var(--blur);
            color: var(--text);
            font-family: var(--body);
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.12s ease-out;
        }

        .glass-button:active {
            transform: scale(0.97);
            background: var(--glass-pressed);
        }

        .glass-button:disabled {
            opacity: 0.4;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .actions .glass-button {
            flex: 1 1 140px;
        }

        .instructions::after {
            content: "";
            width: 8px;
            height: 8px;
            border-right: 2px solid currentColor;
            border-top: 2px solid currentColor;
            transform: rotate(45deg);
        }
    </style>
    <script src="./js/version.js"></script>
    <script src="./js/i18n/i18n_en.js"></script>
    <script src="./js/i18n/i18n_ru.js"></script>
    <script src="./js/i18n/i18n.js"></script>
    <script src="./js/i18n/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="./js/i18n/i18next.js"></script>
    <script src="./js/reveal.js"></script>
</head>

<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="back" id="back" href="./"></a>

    <main class="page settings">

        <div class="group-label" id="presetsTitle"></div>
        <div class="group" id="presets"></div>

        <div class="group-label" id="magicTitle"></div>
        <div class="group">
            <details class="plate">

        <section class="setting">

        <div class="actions">

        <form class="donate" action="https://www.paypal.com/donate" method="post" target="_top">

            <small>PayPal</small>
        </form>
    </main>
    <div class="editor" id="editor" hidden>
        <div class="editor-bar">
            <button type="button" class="small-button" id="editorCancel"></button>
            <span id="editorHint"></span>
            <button type="button" class="small-button accent" id="editorDone"></button>
        </div>
        <div class="editor-stage" id="editorStage">
            <canvas class="photo" id="editorCanvas"></canvas>
            <canvas class="loupe" id="editorLoupe" width="240" height="240" hidden></canvas>
        </div>
        <label class="editor-tools"><span id="editorFontLabel"></span><input type="range" id="editorFont" min="0.4" max="1.6" step="0.05" value="1"></label>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script>
        const presetsMax = 3;
        const presetModes = ["toxic", "ddf", "ddfManual"];
        const t = key => i18next.t(key);

        document.getElementById("version").textContent = "v" + version;
        i18next.use(i18nextBrowserLanguageDetector).init(i18n).then(_ => {
            document.documentElement.lang = i18next.language;
            const texts = {
                back: "backToCalculator", title: "settings", presetsTitle: "presets", presetsHint: "presetsHint",
                magicTitle: "settingsMagic", memoryTitle: "numberMemory", birthdayTitle: "birthday", birthdaySub: "birthdayFormat",
                birthdayHint: "birthdayHint", instructions: "instructions", donate: "donate"
            };
            Object.entries(texts).forEach(([id, key]) => document.getElementById(id).textContent = t(key));
            setupPresets();
            setupMemoryIndex();
            setupReveal();
            setupInterfaceSwitch();
            setupLink();
        });

        function read(key, fallback) {
            try {
                return JSON.parse(localStorage.getItem(key)) ?? fallback;
            } catch (e) {
                return fallback;
            }
        }

        function write(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) { }
        }

        // ---------- presets: number + way (toxic / DDF / DDF manual) + digit key, read by magicios26.js ----------

        function loadPresets() {
            let presets = read("presets", []);
            return Array.isArray(presets) ? presets.slice(0, presetsMax) : [];
        }

        function savePresets(presets, isRenderNeeded) {
            write("presets", presets);
            if (isRenderNeeded) {
                renderPresets();
            }
            showToast("✓ " + t("savedShort"));
        }

        const digits = ["1", "2", "3", "4", "5", "6", "7", "8", "9"];

        // digit picker: one digit on screen, one swipe down = next, one swipe up = previous, tap = next, wraps around.
        // getList is asked on every step, so digits taken by other presets are always skipped
        function digitPicker(box, getList, value, onChange) {
            let span = document.createElement("span");
            span.textContent = value;
            box.textContent = "";
            box.append(span);
            box.setAttribute("aria-valuenow", value);
            let step = dir => {
                let list = getList();
                let i = list.indexOf(value);
                value = list[((i < 0 ? 0 : i + dir) + list.length) % list.length];
                if (span.textContent === value) {
                    return;
                }
                // the new digit slides in from the side the finger came from
                span.style.transition = "none";
                span.style.transform = "translateY(" + dir * -60 + "%)";
                span.style.opacity = 0;
                span.textContent = value;
                box.setAttribute("aria-valuenow", value);
                requestAnimationFrame(_ => requestAnimationFrame(_ => {
                    span.style.transition = "";
                    span.style.transform = "";
                    span.style.opacity = 1;
                }));
                onChange(value);
            };
            let startY = null;
            let isMoved = false;
            box.addEventListener("pointerdown", e => {
                startY = e.clientY;
                isMoved = false;
                box.setPointerCapture(e.pointerId);
            });
            box.addEventListener("pointermove", e => {
                // one swipe = one digit, however long the finger keeps moving
                if (startY !== null && !isMoved && Math.abs(e.clientY - startY) > 12) {
                    step(e.clientY > startY ? 1 : -1);
                    isMoved = true;
                }
            });
            box.addEventListener("pointerup", _ => {
                if (startY !== null && !isMoved) {
                    step(1);
                }
                startY = null;
            });
            box.addEventListener("pointercancel", _ => startY = null);
            box.addEventListener("wheel", e => {
                e.preventDefault();
                step(e.deltaY > 0 ? 1 : -1);
            }, { passive: false });
            box.addEventListener("keydown", e => {
                if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                    e.preventDefault();
                    step(e.key === "ArrowDown" ? 1 : -1);
                }
            });
            // the picker can sit in a plate header: a tap on it must not open or close the plate
            box.addEventListener("click", e => e.preventDefault());
        }

        function freeKeys(presets, own) {
            let taken = presets.map(p => p.key);
            return digits.filter(key => key === own || !taken.includes(key));
        }

        function setupPresets() {
            renderPresets();
        }

        // every preset is a closed plate: key, name, number and way; a tap opens it for editing
        function renderPresets(openIndex) {
            let presets = loadPresets();
            let list = document.getElementById("presets");
            list.textContent = "";
            presets.forEach((preset, index) => {
                let plate = document.createElement("details");
                plate.className = "plate";
                plate.open = index === openIndex;
                plate.innerHTML = `
                    <summary>
                        <span class="keycap"></span>
                        <span class="plate-text"><span class="plate-title"></span><span class="plate-sub"></span></span>
                        <span class="chevron"></span>
                    </summary>
                    <div class="plate-body">
                        <input class="field name" type="text" maxlength="24" autocomplete="off">
                        <input class="field number" type="text" inputmode="numeric" maxlength="13" autocomplete="off">
                        <div class="segmented three" role="radiogroup"></div>
                        <div class="inline"><span class="label"></span><span class="swipe" tabindex="0" role="spinbutton"></span></div>
                        <button type="button" class="remove"></button>
                    </div>`;
                let summary = _ => {
                    plate.querySelector(".keycap").textContent = preset.key;
                    plate.querySelector(".plate-title").textContent = preset.name || t("presetName") + " " + (index + 1);
                    plate.querySelector(".plate-sub").textContent = (preset.value || "—") + " · " + t("presetMode_" + preset.mode);
                };
                summary();
                let name = plate.querySelector(".name");
                name.placeholder = t("presetName") + " " + (index + 1);
                name.value = preset.name || "";
                // saved while typing: leaving the page right away does not lose it
                name.addEventListener("input", _ => {
                    preset.name = name.value.trim();
                    write("presets", presets);
                    summary();
                });
                name.addEventListener("change", _ => showToast("✓ " + t("savedShort")));
                let number = plate.querySelector(".number");
                number.placeholder = t("presetNumber");
                number.value = preset.value || "";
                number.addEventListener("input", _ => {
                    number.value = number.value.replace(/\D/g, "");
                    preset.value = number.value;
                    write("presets", presets);
                    summary();
                });
                number.addEventListener("change", _ => showToast("✓ " + t("savedShort")));
                let modes = plate.querySelector(".segmented");
                presetModes.forEach(mode => {
                    let button = document.createElement("button");
                    button.type = "button";
                    button.setAttribute("role", "radio");
                    button.setAttribute("aria-checked", preset.mode === mode);
                    button.textContent = t("presetMode_" + mode);
                    button.addEventListener("click", _ => {
                        preset.mode = mode;
                        modes.querySelectorAll("button").forEach(b => b.setAttribute("aria-checked", b === button));
                        summary();
                        savePresets(presets);
                    });
                    modes.append(button);
                });
                let label = plate.querySelector(".label");
                label.textContent = t("presetKey");
                label.id = "presetKey" + index;
                let picker = plate.querySelector(".swipe");
                picker.setAttribute("aria-labelledby", label.id);
                digitPicker(picker, _ => freeKeys(presets, preset.key), preset.key, key => {
                    preset.key = key;
                    summary();
                    savePresets(presets);
                });
                let remove = plate.querySelector(".remove");
                remove.textContent = t("presetRemove");
                remove.addEventListener("click", _ => {
                    presets.splice(index, 1);
                    savePresets(presets, true);
                });
                list.append(plate);
            });
            if (presets.length < presetsMax) {
                let add = document.createElement("button");
                add.type = "button";
                add.className = "plate add";
                add.textContent = t("presetAdd");
                add.addEventListener("click", _ => {
                    presets.push({ name: "", value: "", mode: "ddf", key: freeKeys(presets)[0] });
                    savePresets(presets);
                    renderPresets(presets.length - 1);
                    list.querySelector("details[open] .number").focus();
                });
                list.append(add);
            }
        }

        // ---------- number memory: which typed number (1–9) the calculator remembers ----------

        function setupMemoryIndex() {
            let current = String(Number(localStorage.getItem("numberMemoryIndex")) || 3);
            let hint = _ => document.getElementById("memoryHint").textContent = t("numberMemoryHint").replace("{{n}}", current);
            digitPicker(document.getElementById("memoryIndex"), _ => digits, current, n => {
                current = n;
                try { localStorage.setItem("numberMemoryIndex", n); } catch (e) { }
                hint();
                showToast("✓ " + t("savedShort"));
            });
            hint();
        }

        // ---------- photo reveal (js/reveal.js): photo with a blank sheet, its corners, the text, hours ago ----------

        const sampleDate = [14, 10, 1990];

        function setupReveal() {
            const ids = {
                revealCorners: "revealCorners", revealRemove: "revealRemove", revealHoursLabel: "revealHours",
                revealTextLabel: "revealText", revealExampleLabel: "revealExample", revealNoPhoto: "revealNoPhoto",
                editorCancel: "revealCancel", editorDone: "revealDone", editorHint: "revealCornersHint", editorFontLabel: "revealFontSize"
            };
            Object.entries(ids).forEach(([id, key]) => document.getElementById(id).textContent = t(key));

            let file = document.getElementById("revealFile");
            file.addEventListener("change", _ => {
                if (!file.files[0]) {
                    return;
                }
                showToast(t("revealWait"));
                reveal.savePhoto(file.files[0])
                    .then(_ => {
                        file.value = "";
                        renderRevealPhoto();
                        openEditor();
                    })
                    .catch(_ => showToast(t("revealError")));
            });
            document.getElementById("revealCorners").addEventListener("click", openEditor);
            document.getElementById("revealRemove").addEventListener("click", _ => {
                reveal.removePhoto().then(renderRevealPhoto);
                showToast("✓ " + t("savedShort"));
            });

            let hours = Array.from({ length: 48 }, (_, i) => String(i + 1));
            digitPicker(document.getElementById("revealHours"), _ => hours, String(reveal.getHours()), n => {
                try { localStorage.setItem("revealHours", n); } catch (e) { }
                showToast("✓ " + t("savedShort"));
            });

            let template = document.getElementById("revealTemplate");
            template.value = reveal.getTemplate();
            let example = _ => document.getElementById("revealExample").textContent = reveal.fillTemplate(template.value, sampleDate);
            template.addEventListener("input", _ => {
                try { localStorage.setItem("revealTemplate", template.value); } catch (e) { }
                example();
            });
            template.addEventListener("change", _ => showToast("✓ " + t("savedShort")));
            let isRu = i18next.language.startsWith("ru");
            (isRu ? ["знак", "день", "дата", "дней", "возраст"] : ["sign", "day", "date", "days", "age"]).forEach(tag => {
                let chip = document.createElement("button");
                chip.type = "button";
                chip.textContent = tag;
                // keep the cursor in the text: the tag goes where it stands
                chip.addEventListener("pointerdown", e => e.preventDefault());
                chip.addEventListener("click", _ => {
                    let start = template.selectionStart ?? template.value.length;
                    let end = template.selectionEnd ?? start;
                    template.setRangeText("{" + tag + "}", start, end, "end");
                    template.dispatchEvent(new Event("input"));
                    template.focus();
                });
                document.getElementById("revealTags").append(chip);
            });
            example();
            renderRevealPhoto();
        }

        let revealThumbUrl;
        function renderRevealPhoto() {
            let isPhoto = reveal.hasPhoto();
            let thumb = document.getElementById("revealThumb");
            document.getElementById("revealAdd").textContent = t(isPhoto ? "revealReplace" : "revealAdd");
            document.getElementById("revealCorners").hidden = !isPhoto;
            document.getElementById("revealRemove").hidden = !isPhoto;
            document.getElementById("revealNoPhoto").hidden = isPhoto;
            thumb.hidden = !isPhoto;
            if (revealThumbUrl) {
                URL.revokeObjectURL(revealThumbUrl);
                revealThumbUrl = null;
            }
            if (isPhoto) {
                reveal.loadPhoto().then(stored => {
                    if (stored) {
                        revealThumbUrl = URL.createObjectURL(stored.blob);
                        thumb.src = revealThumbUrl;
                    }
                });
            }
        }

        // the photo fits the screen; dots are dragged with a loupe above the finger, the sample text follows at once
        function openEditor() {
            let meta = reveal.getMeta();
            if (!meta) {
                return;
            }
            reveal.loadPhoto().then(stored => reveal.decode(stored.blob)).then(image => {
                let editor = document.getElementById("editor");
                let stage = document.getElementById("editorStage");
                let canvas = document.getElementById("editorCanvas");
                let loupe = document.getElementById("editorLoupe");
                let font = document.getElementById("editorFont");
                editor.hidden = false;
                let corners = meta.corners.map(c => c.slice());
                font.value = meta.fontScale || 1;
                let box = stage.getBoundingClientRect();
                let scale = Math.min((box.width - 24) / image.width, (box.height - 24) / image.height);
                let cssW = Math.round(image.width * scale), cssH = Math.round(image.height * scale);
                let dpr = Math.min(2, window.devicePixelRatio || 1);
                canvas.style.width = cssW + "px";
                canvas.style.height = cssH + "px";
                canvas.width = Math.round(cssW * dpr);
                canvas.height = Math.round(cssH * dpr);
                let g = canvas.getContext("2d");
                let text = reveal.fillTemplate(reveal.getTemplate(), sampleDate);
                let frame = 0;
                let draw = _ => {
                    frame = 0;
                    g.drawImage(image, 0, 0, canvas.width, canvas.height);
                    reveal.drawOnSheet(g, text, reveal.orderCorners(corners).map(([x, y]) => [x * canvas.width, y * canvas.height]), Number(font.value));
                };
                let redraw = _ => frame = frame || requestAnimationFrame(draw);
                draw();

                stage.querySelectorAll(".handle").forEach(h => h.remove());
                let origin = _ => {
                    let r = canvas.getBoundingClientRect();
                    let s = stage.getBoundingClientRect();
                    return { left: r.left - s.left, top: r.top - s.top, width: r.width, height: r.height, abs: r };
                };
                let place = (handle, i) => {
                    let o = origin();
                    handle.style.left = o.left + corners[i][0] * o.width + "px";
                    handle.style.top = o.top + corners[i][1] * o.height + "px";
                };
                let lg = loupe.getContext("2d");
                let showLoupe = (i, handle) => {
                    let o = origin();
                    let [x, y] = corners[i];
                    let zoom = 3;
                    let size = 240 / (zoom * scale * 2);
                    lg.fillStyle = "#000";
                    lg.fillRect(0, 0, 240, 240);
                    lg.drawImage(image, x * image.width - size / 2, y * image.height - size / 2, size, size, 0, 0, 240, 240);
                    lg.strokeStyle = "#FF9200";
                    lg.lineWidth = 2;
                    lg.beginPath();
                    lg.moveTo(120, 96); lg.lineTo(120, 144);
                    lg.moveTo(96, 120); lg.lineTo(144, 120);
                    lg.stroke();
                    let left = o.left + x * o.width - 60;
                    let top = o.top + y * o.height - 160;
                    if (top < 0) {
                        top = o.top + y * o.height + 40;
                    }
                    loupe.style.left = Math.max(0, Math.min(stage.clientWidth - 120, left)) + "px";
                    loupe.style.top = top + "px";
                    loupe.hidden = false;
                };
                corners.forEach((_, i) => {
                    let handle = document.createElement("div");
                    handle.className = "handle";
                    stage.append(handle);
                    place(handle, i);
                    let grab = null;
                    handle.addEventListener("pointerdown", e => {
                        let o = origin();
                        // keep the offset between the finger and the dot, so the dot does not jump under the finger
                        grab = { dx: e.clientX - (o.abs.left + corners[i][0] * o.width), dy: e.clientY - (o.abs.top + corners[i][1] * o.height) };
                        handle.setPointerCapture(e.pointerId);
                        showLoupe(i, handle);
                    });
                    handle.addEventListener("pointermove", e => {
                        if (!grab) {
                            return;
                        }
                        let o = origin();
                        corners[i] = [
                            Math.min(1, Math.max(0, (e.clientX - grab.dx - o.abs.left) / o.width)),
                            Math.min(1, Math.max(0, (e.clientY - grab.dy - o.abs.top) / o.height))
                        ];
                        place(handle, i);
                        showLoupe(i, handle);
                        redraw();
                    });
                    let drop = _ => {
                        grab = null;
                        loupe.hidden = true;
                    };
                    handle.addEventListener("pointerup", drop);
                    handle.addEventListener("pointercancel", drop);
                });
                font.oninput = redraw;
                let close = isSave => {
                    if (isSave) {
                        reveal.setMeta(Object.assign(reveal.getMeta(), { corners, fontScale: Number(font.value) }));
                        showToast("✓ " + t("savedShort"));
                    }
                    editor.hidden = true;
                };
                document.getElementById("editorDone").onclick = _ => close(true);
                document.getElementById("editorCancel").onclick = _ => close(false);
            }).catch(_ => showToast(t("revealError")));
        }

        // ---------- calculator look ----------

        function setupInterfaceSwitch() {
            document.getElementById("uiTitle").textContent = t("interface");
            document.getElementById("uiHint").textContent = t("interfaceHint");
            const buttons = document.querySelectorAll("#ui button");
            const render = _ => {
                let current = "new";
                try { current = localStorage.getItem("ui") === "classic" ? "classic" : "new"; } catch (e) { }
                buttons.forEach(b => b.setAttribute("aria-checked", b.dataset.ui === current));
            };
            buttons.forEach(button => {
                button.textContent = t(button.dataset.ui === "classic" ? "interfaceClassic" : "interfaceNew");
                button.addEventListener("click", _ => {
                    try {
                        button.dataset.ui === "classic" ? localStorage.setItem("ui", "classic") : localStorage.removeItem("ui");
                    } catch (e) { }
                    render();
                    showToast("✓ " + t("saved"));
                });
            });
            render();
        }

        // ---------- remote control link for the viewer's phone ----------

        function setupLink() {
            let button = document.getElementById("link");
            let peerId = localStorage.getItem("currentPeerId");
            button.title = t("copyLinkHint");
            button.addEventListener("click", _ => {
                if (!peerId) {
                    showToast(t("linkNoId"));
                    return;
                }
                let href = new URL("./?hostPeerId=" + peerId, window.location.href).href;
                navigator.clipboard.writeText(href)
                    .then(_ => showToast("✓ " + href.replace(/^https?:\/\//, "").slice(0, 42) + "…"));
            });
        }

        let toastTimer;
        function showToast(text) {
            const toast = document.getElementById("toast");
            toast.textContent = text;
            toast.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(_ => toast.classList.remove("show"), 1800);
        }
    </script>
</body>
